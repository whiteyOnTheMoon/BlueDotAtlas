  <radialGradient id="halo"><stop stop-color="#13B6EF" stop-opacity=".24"/><stop offset="1" stop-color="#021934" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="clip"><rect width="1280" height="720"/></clipPath>
</defs>
