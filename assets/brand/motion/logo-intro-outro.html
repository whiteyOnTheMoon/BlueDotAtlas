<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueDotAtlas — Separate short logo intro/outro</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071522}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 77% 46%,#0c3552 0%,#071b2d 45%,#061522 78%,#04101d 100%)}
#contours{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
#contours g{fill:none;stroke:#17ABDE;stroke-linecap:round;stroke-width:2.2;opacity:.24}
#tint{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,16,32,.62),rgba(2,20,34,.05) 65%),linear-gradient(0deg,rgba(2,14,25,.24),transparent 28%)}
#pulse{position:absolute;left:572px;top:532px;width:330px;height:330px;transform:translate(-50%,-50%);border:2px solid rgba(25,183,244,.35);border-radius:50%;box-shadow:0 0 45px rgba(16,170,236,.1);opacity:0}
#pulse2{position:absolute;left:572px;top:532px;width:225px;height:225px;transform:translate(-50%,-50%);border:1px solid rgba(55,214,196,.45);border-radius:50%;opacity:0}
#brand{position:absolute;left:300px;top:379px;width:1320px;height:auto;opacity:0;display:block;will-change:transform,opacity,clip-path}
</style></head>
<body>
<div id="stage" role="img" aria-label="BlueDotAtlas original logo animated on an abstract dark-blue contour background. Original illustration; not Earth observational data.">
<svg id="contours" viewBox="0 0 1920 1080" aria-hidden="true">
 <g id="lines" transform="rotate(-13 1380 490)">
 <ellipse cx="1380" cy="490" rx="282" ry="128"/>
 <ellipse cx="1380" cy="490" rx="365" ry="172"/>
 <ellipse cx="1380" cy="490" rx="452" ry="216"/>
 <ellipse cx="1380" cy="490" rx="538" ry="260"/>
 <ellipse cx="1380" cy="490" rx="621" ry="306"/>
 <ellipse cx="1380" cy="490" rx="706" ry="351"/>
 <ellipse cx="1380" cy="490" rx="791" ry="394"/>
 <ellipse cx="1380" cy="490" rx="876" ry="446"/>
 </g>
</svg>
<div id="tint"></div><div id="pulse"></div><div id="pulse2"></div>
<img id="brand" src="/assets/brand/logo/logo-dark.svg" alt="BlueDotAtlas — The Planet Has a Story.">
</div>
<script>
(function(){
 const stage=document.getElementById('stage');
 const logo=document.getElementById('brand');
 const pulse=document.getElementById('pulse'),pulse2=document.getElementById('pulse2'),lines=document.getElementById('lines');
 const duration={intro:2.3,outro:2.2};
 const smooth=(a,b,x)=>{const v=Math.max(0,Math.min(1,(x-a)/(b-a)));return v*v*(3-2*v)};
 function setLogoTime(t,mode){
  const clip=mode==='outro'?'outro':'intro';
  t=Math.max(0,Math.min(duration[clip],t));
  const entry=clip==='intro'?smooth(.12,.56,t):smooth(.02,.53,t);
  const exit=clip==='intro'?1-smooth(1.84,2.3,t):1-smooth(1.69,2.2,t);
  const alpha=entry*exit;
  const wipe=clip==='intro'?Math.min(1,.315*smooth(.12,.58,t)+.685*smooth(.48,1.37,t)):1;
  const up=clip==='intro'?17*(1-smooth(.28,1.30,t)):14*(1-smooth(.02,.75,t));
  const scale=clip==='intro'?1:.985+.015*smooth(.02,.68,t);
  const ring=(clip==='intro'?smooth(.20,.65,t)*(1-smooth(.75,1.35,t)):smooth(.12,.63,t)*(1-smooth(1.27,1.90,t)))*alpha;
  logo.style.opacity=alpha.toFixed(4);
  logo.style.clipPath='inset(0 '+((1-wipe)*100).toFixed(3)+'% 0 0)';
  logo.style.transform='translateY('+up.toFixed(2)+'px) scale('+scale.toFixed(5)+')';
  pulse.style.opacity=(ring*.57).toFixed(4);
  pulse2.style.opacity=(ring*.85).toFixed(4);
  const ringScale=(.76+.26*smooth(.20,1.10,t)).toFixed(5);
  pulse.style.transform='translate(-50%,-50%) scale('+ringScale+')';
  pulse2.style.transform='translate(-50%,-50%) scale('+(.72+.26*smooth(.15,.95,t)).toFixed(5)+')';
  lines.style.transform='translate('+(-2*t).toFixed(3)+'px,'+(3*Math.sin(t*.8)).toFixed(3)+'px) rotate(-13deg)';
  return {mode:clip,time:t,alpha,wipe,scale,ring};
 }
 function resize(){const v=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+v+')';stage.style.transformOrigin='top left';stage.style.left=((innerWidth-1920*v)/2)+'px';stage.style.top=((innerHeight-1080*v)/2)+'px';}
 window.setLogoTime=setLogoTime;
 window.logoClipSpec={duration,fps:30,width:1920,height:1080,
  branding:'Unmodified approved logo-dark.svg, animated via opacity, position and reveal mask only',
  art:'Original abstract procedural contour background; not satellite or measured data',
  notes:'Separate silent logo intro and outro; location labels/lower thirds are separate film components'};
 resize();addEventListener('resize',resize);
 const q=new URLSearchParams(location.search);
 setLogoTime(0,q.get('clip')==='outro'?'outro':'intro');
})();
</script>
</body></html>
