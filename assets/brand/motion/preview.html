<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlueDotAtlas · Motion Design 007 · 10s Test</title>
<style>
@font-face{font-family:"Space Grotesk Demo";src:url("/fonts/space.woff2") format("woff2");font-weight:300 700;font-display:block}
@font-face{font-family:"Inter Demo";src:url("/fonts/inter-regular.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Inter Demo";src:url("/fonts/inter-semibold.woff2") format("woff2");font-weight:600 700;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522}
#stage{width:1920px;height:1080px;position:absolute;left:0;top:0;overflow:hidden;background:radial-gradient(ellipse at 77% 47%,#0d5270 0%,#06283e 37%,#071522 78%);color:#F2F9FF}
#stage:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(2,25,52,.58),rgba(2,25,52,.18) 45%,rgba(2,25,52,.07) 80%),linear-gradient(0deg,rgba(2,14,28,.40),transparent 30%)}
#oceanGrid{position:absolute;inset:-90px;width:2100px;height:1260px;opacity:.78;filter:drop-shadow(0 0 11px #08BCEB88)}
#glow{position:absolute;left:930px;top:155px;width:970px;height:770px;background:radial-gradient(ellipse,#0ab9db3c 4%,#0988bc1e 38%,transparent 69%);filter:blur(38px)}
.overlay{position:absolute;z-index:5;opacity:0;pointer-events:none}
#introLogo{left:112px;top:105px;width:702px;height:171px}
#introLogo img{display:block;width:100%;height:auto}
#lowerThird{left:118px;top:752px;width:865px;height:215px;background:linear-gradient(90deg,rgba(2,25,52,.93),rgba(2,25,52,.76));border-left:8px solid #37D6C4;border-radius:8px;padding:25px 36px 22px}
.kicker{font:600 26px "Inter Demo",Arial,sans-serif;letter-spacing:.13em;color:#49B9F0}
#lowerThird .place{font:700 63px/1.14 "Space Grotesk Demo",Arial,sans-serif;letter-spacing:-.03em;margin:9px 0 6px}
#lowerThird .subtitle{font:400 26px/1.3 "Inter Demo",Arial,sans-serif;color:#B4CCDC}
#mapMarker{left:1343px;top:403px;width:460px;height:171px}
#mapMarker svg{display:block;position:absolute;left:0;top:45px;width:150px;height:120px}
#mapMarker .markerText{position:absolute;left:133px;top:0}
#mapMarker .markerTitle{font:600 27px "Inter Demo",Arial,sans-serif;letter-spacing:.07em}
#mapMarker .markerMeta{font:400 25px "Inter Demo",Arial,sans-serif;color:#B4CCDC;margin-top:9px}
#source{left:118px;top:845px;width:1190px;height:125px;border-radius:8px;border-left:8px solid #37D6C4;background:linear-gradient(90deg,rgba(2,25,52,.92),rgba(2,25,52,.62));padding:24px 35px}
#source .title{font:600 34px "Inter Demo",Arial,sans-serif;letter-spacing:.035em}
#source .meta{font:400 24px "Inter Demo",Arial,sans-serif;color:#B4CCDC;margin-top:13px}
#outro{left:350px;top:385px;width:1130px;height:292px;text-align:left}
#outro img{display:block;width:1030px;height:auto}
#outro p{font:600 29px "Inter Demo",Arial,sans-serif;letter-spacing:.18em;color:#B4CCDC;margin:21px 0 0 8px}
#demoLabel{position:absolute;z-index:4;right:86px;bottom:68px;color:#6DA7C1;font:600 19px "Inter Demo",Arial,sans-serif;letter-spacing:.16em;opacity:.57}
</style>
</head>
<body>
<div id="stage" aria-label="BlueDotAtlas motion demo; original abstract scientific illustration, not satellite data">
  <div id="glow"></div>
  <svg id="oceanGrid" viewBox="0 0 2100 1260" aria-hidden="true">
    <defs>
      <linearGradient id="contourInk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23DCF0" stop-opacity=".27"/><stop offset=".5" stop-color="#19B7F4" stop-opacity=".79"/><stop offset="1" stop-color="#D0FBFF" stop-opacity=".19"/></linearGradient>
      <radialGradient id="navyGlobe"><stop stop-color="#006092" stop-opacity=".31"/><stop offset=".7" stop-color="#083E64" stop-opacity=".22"/><stop offset="1" stop-color="#071522" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="1488" cy="623" rx="790" ry="560" fill="url(#navyGlobe)"/>
    <g fill="none" stroke="url(#contourInk)" stroke-linecap="round" transform="translate(1470 610) rotate(-19)">
      <ellipse rx="740" ry="420" stroke-width="6"/>
      <ellipse rx="660" ry="367" stroke-width="4"/>
      <ellipse rx="575" ry="320" stroke-width="8"/>
      <ellipse rx="494" ry="267" stroke-width="5"/>
      <ellipse rx="412" ry="215" stroke-width="8"/>
      <ellipse rx="334" ry="169" stroke-width="6"/>
      <ellipse rx="252" ry="125" stroke-width="9"/>
      <ellipse rx="170" ry="79" stroke-width="7"/>
      <ellipse rx="87" ry="38" stroke-width="7"/>
    </g>
    <g stroke="#23E4E8" stroke-opacity=".12" stroke-width="2" fill="none">
      <path d="M0 240 C450 140 680 300 940 240 S1490 110 2100 250"/>
      <path d="M0 1030 C540 860 1010 1100 1460 940 S1920 790 2100 935"/>
      <path d="M920 0 C890 360 1070 590 1005 1260"/>
      <path d="M1710 0 C1570 380 1810 780 1680 1260"/>
    </g>
  </svg>
  <div id="introLogo" class="overlay" data-motif="logo-intro"><img src="/assets/brand/logo/logo-dark.svg" alt="BlueDotAtlas · The Planet Has a Story."/></div>
  <div id="lowerThird" class="overlay" data-motif="lower-third">
    <div class="kicker">LOCATION · ILLUSTRATIVE DEMO</div>
    <div class="place">North Atlantic</div>
    <div class="subtitle">Patterns in motion · no observational data</div>
  </div>
  <div id="mapMarker" class="overlay" data-motif="map-marker">
    <svg viewBox="0 0 150 120" aria-hidden="true">
      <g fill="none" stroke="#19B7F4" stroke-width="3">
        <circle id="markerPulse" cx="58" cy="73" r="35" opacity=".6"/>
        <circle cx="58" cy="73" r="18" opacity=".9"/>
        <path d="M77 62 L111 23 L148 23" stroke="#B4CCDC" stroke-width="2"/>
      </g>
      <circle cx="58" cy="73" r="7" fill="#37D6C4"/>
    </svg>
    <div class="markerText"><div class="markerTitle">MAP MARKER</div><div class="markerMeta">DEMOSTRATION ONLY</div></div>
  </div>
  <div id="source" class="overlay" data-motif="source-caption">
    <div class="title">SOURCE · AGENCY / SENSOR / DATE</div>
    <div class="meta">Caption placeholder — verify actual evidence before publication</div>
  </div>
  <div id="outro" class="overlay" data-motif="outro"><img src="/assets/brand/logo/logo-dark.svg" alt="BlueDotAtlas · The Planet Has a Story."/><p>EARTH &amp; CLIMATE DOCUMENTARIES</p></div>
  <div id="demoLabel">ILLUSTRATIVE MOTION STUDY · NOT SATELLITE DATA</div>
</div>
<script>
(function(){
  const stage=document.getElementById('stage');
  const $=id=>document.getElementById(id);
  function resize(){
    const s=Math.min(innerWidth/1920,innerHeight/1080);
    stage.style.transform='scale('+s+')'; stage.style.transformOrigin='top left';
    stage.style.left=(innerWidth-1920*s)/2+'px'; stage.style.top=(innerHeight-1080*s)/2+'px';
  }
  function ease(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
  function vis(t,a,b,c,d){return Math.max(0,Math.min(ease((t-a)/(b-a)),1-ease((t-c)/(d-c))))}
  function show(id,alpha,translateY){
    const el=$(id);el.style.opacity=alpha.toFixed(4);el.style.transform='translateY('+translateY.toFixed(2)+'px)';
  }
  window.setMotionTime=function(t){
    const a=vis(t,.65,1.23,2.05,2.65);
    const b=vis(t,2.65,3.20,6.05,6.60);
    const c=vis(t,3.10,3.52,5.93,6.40);
    const d=vis(t,6.50,6.95,7.95,8.45);
    const e=vis(t,8.45,8.95,9.57,10.00);
    show('introLogo',a,22*(1-ease((t-.65)/.58)));
    show('lowerThird',b,32*(1-ease((t-2.65)/.55)));
    show('mapMarker',c,15*(1-ease((t-3.10)/.42)));
    show('source',d,18*(1-ease((t-6.5)/.45)));
    show('outro',e,22*(1-ease((t-8.45)/.5)));
    $('oceanGrid').style.transform='translate('+(9*Math.sin(t*.33)).toFixed(2)+'px,'+(10*Math.cos(t*.29)).toFixed(2)+'px) rotate('+(t*.18).toFixed(3)+'deg)';
    $('glow').style.opacity=(.65+.23*Math.sin(t*1.1)).toFixed(3);
    $('markerPulse').setAttribute('r',(34+8*Math.sin(t*4.5)).toFixed(2));
    $('demoLabel').style.opacity=(.4+.1*Math.sin(t*.55)).toFixed(3);
    return {intro:a,lowerThird:b,mapMarker:c,source:d,outro:e};
  };
  window.motionSpec={
    seconds:10,fps:30,width:1920,height:1080,
    ranges:[{id:"intro",start:.65,end:2.65},{id:"lowerThird",start:2.65,end:6.60},{id:"mapMarker",start:3.10,end:6.40},{id:"source",start:6.50,end:8.45},{id:"outro",start:8.45,end:10.00}],
    imagery:"ORIGINAL ABSTRACT ART · NOT SATELLITE OR OBSERVATIONAL DATA",
    imageRights:"All background contour paths are project-original SVG geometry. Official logo loaded without modification."
  };
  resize();addEventListener('resize',resize);window.setMotionTime(0);
})();
</script>
</body>
</html>
