<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-labelledby="title desc">
<title id="title">BlueDotAtlas — Deep Ocean / Glacial Light color palette</title>
<desc id="desc">The approved BlueDotAtlas palette: Deep Sea #021934, Ice White #F2F9FF, Blue Dot #10AAEC, Glacier #37D6C4, Deep Night #071522, with light and dark UI token demonstrations.</desc>
