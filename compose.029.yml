# Roadmap 029: review-only scaffold, not an approved production deployment.
name: bluedotatlas-029
services:
  db:
    image: postgres:16-alpine
    env_file:
      - ${BDA_DB_ENV_FILE:?Specify an externally stored private db env file}
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 0.25
    mem_limit: 512m
    pids_limit: 150
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - bda_pgdata:/var/lib/postgresql/data
    networks:
      - private_db
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    env_file:
      - ${BDA_WEB_ENV_FILE:?Specify an externally stored private web env file}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 384m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - edge
      - private_db
  migrate:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: migrate
    env_file:
      - ${BDA_WEB_ENV_FILE:?Specify an externally stored private web env file}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cpus: 0.25
    mem_limit: 512m
    networks:
      - private_db
  worker:
    # 027 only implements a synthetic test executor; not a production renderer.
    profiles: [future-renderer]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker
    env_file:
      - ${BDA_WORKER_ENV_FILE:?Specify an externally stored private worker env file}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cpus: 0.5
    mem_limit: 1024m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - private_db
networks:
  edge:
    driver: bridge
  private_db:
    internal: true
volumes:
  bda_pgdata:
    # Compose automatically namespaces under bluedotatlas-029.
