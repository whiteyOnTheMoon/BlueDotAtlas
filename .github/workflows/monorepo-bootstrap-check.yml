name: Monorepo bootstrap check

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'scripts/check-monorepo.test.mjs'
      - '.github/workflows/monorepo-bootstrap-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (frozen once lockfile is committed)
        run: |
          if test -f pnpm-lock.yaml; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
            echo "::notice::Bootstrap only: commit the generated lockfile and rerun frozen install before approval"
          fi
      - name: Workspace structure tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Export generated lockfile for review
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-lockfile
          path: pnpm-lock.yaml
          retention-days: 7
      - name: Show formatter suggestions (temporary bootstrap review)
        if: always()
        run: |
          pnpm exec prettier --write "apps/**/*.{ts,json}" "packages/**/*.{ts,json}" package.json tsconfig.base.json pnpm-workspace.yaml eslint.config.mjs .prettierrc.json
          git diff -- apps packages tsconfig.base.json
      - name: Print lockfile as base64 for manual onboarding
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        run: |
          echo BDA_LOCKFILE_START
          base64 -w0 pnpm-lock.yaml
          echo
          echo BDA_LOCKFILE_END
