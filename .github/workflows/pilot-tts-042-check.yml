name: M03 042 real open-model narration and WAV QA

on:
  pull_request:
    paths:
      - 'scripts/tts-042-*'
      - 'scripts/generate-tts-042.py'
      - 'scripts/check-tts-042.py'
      - '.github/workflows/pilot-tts-042-check.yml'
      - 'docs/pilot/60s-script.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-speech-042:
    name: 042 Real speech / 7 paragraphs / 48kHz WAV
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
      BDA_TTS_042_PRIVATE_TEST: 'TRUE'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure source / release / provenance negative tests
        run: node --test scripts/tts-042-plan.test.mjs
      - name: Prepare strict narration plan from current 037 script
        run: node scripts/tts-042-plan.mjs
      - name: Install pinned Python TTS runtime only on disposable runner
        run: |
          python -m pip install --disable-pip-version-check "kokoro-onnx==0.6.1" "numpy==2.2.6" "scipy==1.16.3"
          if ! command -v espeak-ng >/dev/null 2>&1; then
            timeout 180 sudo apt-get install -y --no-install-recommends espeak-ng
          fi
      - name: Download exactly pinned Kokoro model and voice SHA, speak real pilot text
        run: python scripts/generate-tts-042.py
      - name: Independently check WAV, 7 speech segments and silence boundaries
        run: python scripts/check-tts-042.py .tmp-tts-042/audio/pilot-narration.wav .tmp-tts-042/audio/pilot-narration-qa.json
      - name: Upload only synthesized private-review WAV and non-secret timing metadata
        uses: actions/upload-artifact@v4
        with:
          name: tts-042-original-seven-fragment-review
          path: |
            .tmp-tts-042/audio/pilot-narration.wav
            .tmp-tts-042/audio/pilot-narration-qa.json
          retention-days: 5
          if-no-files-found: error
      - name: Remove large third-party model files and generated audio from runner
        if: always()
        run: |
          rm -rf -- .tmp-tts-042/
          echo "042 runner-only model and WAV cleanup complete"
