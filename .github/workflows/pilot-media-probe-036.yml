name: M03 036 bounded ephemeral original-video probe

on:
  pull_request:
    paths:
      - 'scripts/probe-pilot-media-036.py'
      - '.github/workflows/pilot-media-probe-036.yml'

permissions:
  contents: read

jobs:
  ephemeral-probe-036:
    name: "036 Two NOAA source files: bounded hash and ffprobe (not rights approval)"
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/036-bounded-media-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout feature PR without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-lock and negative-tests (no HTTP)
        run: python3 scripts/probe-pilot-media-036.py --self-test
      - name: Inspect official NASA Oma page for an exact video URL (no media download)
        run: |
          python3 - <<'PY'
          from html import unescape
          import re
          from urllib.request import urlopen, Request
          url='https://eol.jsc.nasa.gov/Videos/CrewEarthObservationsVideos/Special.htm'
          try:
              html=urlopen(Request(url,headers={'User-Agent':'BlueDotAtlas-036-source-audit/1.0'}),timeout=25).read(2000000).decode('utf-8','replace')
              match=re.search('Hurricane Oma',html,re.IGNORECASE)
              if not match:
                  print('NASA-036-Oma: TITLE_NOT_FOUND')
              else:
                  fragment=html[max(0, match.start()-250):match.start()+10000]
                  links=re.findall(r'(?:src|href|data-src|data-href)\s*=\s*"([^"]+)"',fragment,re.IGNORECASE)
                  print('NASA-036-Oma: official title found; nearby explicit links follow')
                  for link in list(dict.fromkeys(links))[:35]:
                      print('NASA-036-NEARBY-LINK: '+unescape(link)[:350])
                  print('NASA-036-HTML-CONTEXT: '+re.sub(r'\s+',' ',fragment[:1000])[:1000])
          except Exception as exc:
              print('NASA-036-Oma: SOURCE_HTML_UNAVAILABLE '+type(exc).__name__)
          PY
      - name: Install isolated FFmpeg tools on throwaway CI runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Probe exact two NOAA MP4s temporarily (max 100 MB per asset)
        env:
          BDA_036_EPHEMERAL_PROBE: 'TRUE'
        run: |
          command -v ffprobe
          command -v ffmpeg
          python3 scripts/probe-pilot-media-036.py --probe
          echo "Source-probe metadata is informational. No human visual, audio-rights or publication review performed."
