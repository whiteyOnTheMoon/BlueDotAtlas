name: M02 026 API v1 validation and HTTP integration

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/db/**'
      - 'scripts/check-api-v1.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-v1-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bda_test
          POSTGRES_PASSWORD: bda_test_only
          POSTGRES_DB: bda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bda_test -d bda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bda_test:bda_test_only@localhost:5432/bda_test
      BDA_DB_TEST: '1'
      BDA_ADMIN_EMAIL: admin-ci@bluedotatlas.invalid
      BDA_TEST_ADMIN_PASSWORD: 'SYNTHETIC-Only-Passphrase-026-for-CI!'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen install, unit tests and static checks
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm build
      - name: Drizzle migration integrity and isolated PostgreSQL setup
        run: |
          pnpm --filter @bluedotatlas/db db:check
          pnpm --filter @bluedotatlas/db db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "Migration drift detected"
            exit 1
          fi
          pnpm --filter @bluedotatlas/db db:migrate
          pnpm --filter @bluedotatlas/db db:migrate
      - name: Create synthetic CI-only admin password hash
        run: |
          hash="$(printf '%s' "$BDA_TEST_ADMIN_PASSWORD" | node packages/db/scripts/hash-admin-password.mjs)"
          echo "BDA_ADMIN_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"
      - name: Live production-mode Next.js API HTTP/DB/authorization regression
        run: node scripts/check-api-v1.mjs
