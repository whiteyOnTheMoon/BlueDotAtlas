name: M03 036 pilot rights manifest gate

on:
  pull_request:
    paths:
      - 'assets/pilot/**'
      - 'scripts/check-pilot-rights-036.mjs'
      - 'scripts/check-pilot-manual-review-036.mjs'
      - 'docs/pilot/manual-media-review-036.md'
      - '.github/workflows/pilot-rights-036-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-manifest-036:
    name: 036 Private-test source provenance and strict release safeguards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original source provenance and denial cases
        run: node scripts/check-pilot-rights-036.mjs --self-test
      - name: Reject fabricated full audio and public-film approval in review notes
        run: node scripts/check-pilot-manual-review-036.mjs --self-test
