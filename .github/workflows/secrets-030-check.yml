name: M02 030 tracked secret boundary and safe diagnostic checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-030:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic negative tests and tracked-file checks (no secret output)
        run: |
          node --test scripts/check-secrets-030.test.mjs
          node scripts/check-secrets-030.mjs
      - name: Read-only operator checker syntax (do NOT run against runner or VPS)
        run: |
          bash -n scripts/verify-secrets-030.sh
          node --check scripts/check-secrets-030-http.mjs
