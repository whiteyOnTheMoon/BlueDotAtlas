name: Temporary 041 prettier and offline QA bootstrap (self-removing)

on:
  push:
    branches:
      - feat/041-science-process

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Format only added 041 module and changed video files
        run: |
          pnpm exec prettier --write packages/video/src/compositions/ScienceScene.tsx packages/video/src/compositions/ScienceProof.tsx packages/video/src/compositions/science-plan.js packages/video/src/compositions/RemotionRoot.tsx packages/video/package.json
      - name: Validate 041 science timing, source and P60 blocker tests
        run: node --test scripts/check-science-041.test.mjs
      - name: Build strict TS video module
        run: pnpm --filter @bluedotatlas/video build
      - name: Commit formatted code and delete this temporary workflow
        run: |
          set -eu
          test "$(git branch --show-current)" = "feat/041-science-process"
          git rm -- .github/workflows/science-041-format-bootstrap.yml
          git add -- packages/video/
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(041): format science module and remove one-time QA bootstrap"
          git push origin HEAD:feat/041-science-process
