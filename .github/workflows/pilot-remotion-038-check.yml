name: M03 038 Remotion 1080p film proof

on:
  pull_request:
    paths:
      - 'packages/video/**'
      - 'scripts/check-remotion-038*'
      - '.github/workflows/pilot-remotion-038-check.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remotion-proof-038:
    name: 038 Remotion 10s 1080p render and probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Timeline and negative ffprobe tests
        run: node --test scripts/check-remotion-038.test.mjs
      - name: Compile video workspace
        run: pnpm --filter @bluedotatlas/video build
      - name: Render actual 300 frames with one browser tab
        run: pnpm --filter @bluedotatlas/video render:proof
        env:
          REMOTION_DISABLE_TELEMETRY: '1'
      - name: Validate encoded output
        run: node scripts/check-remotion-038.mjs packages/video/out/038-proof.mp4
      - name: Capture three inspectable frames
        run: |
          set -eu
          video="packages/video/out/038-proof.mp4"
          for sample in 1 3 5; do
            ffmpeg -v error -y -ss "$sample" -i "$video" -frames:v 1 "packages/video/out/frame-${sample}s.jpg"
          done
      - name: Upload 10s proof and review frames
        uses: actions/upload-artifact@v4
        with:
          name: remotion-038-ten-second-proof
          path: |
            packages/video/out/038-proof.mp4
            packages/video/out/frame-*.jpg
          retention-days: 5
          if-no-files-found: error
