name: M02 025 single-admin authentication integration

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'scripts/check-admin-auth.mjs'
      - '.github/workflows/admin-auth-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bda_test
          POSTGRES_PASSWORD: bda_test_only
          POSTGRES_DB: bda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bda_test -d bda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bda_test:bda_test_only@localhost:5432/bda_test
      BDA_DB_TEST: '1'
      BDA_ADMIN_EMAIL: admin-ci@bluedotatlas.invalid
      BDA_TEST_ADMIN_PASSWORD: 'SYNTHETIC-Only-Passphrase-025-for-CI!'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initial link and lockfile generation (bootstrap only)
        run: pnpm install --no-frozen-lockfile
      - name: Build core and generate incremental auth migration
        run: |
          pnpm --filter @bluedotatlas/core build
          pnpm --filter @bluedotatlas/db db:generate
      - name: Typecheck and regression suite
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm build
      - name: Migrate isolated PostgreSQL database
        run: pnpm --filter @bluedotatlas/db db:migrate
      - name: Database auth and M02 023-024 regression
        run: pnpm --filter @bluedotatlas/db test:integration
      - name: Provision CI-only synthetic password hash
        shell: bash
        run: |
          set -euo pipefail
          hash="$(printf '%s' "$BDA_TEST_ADMIN_PASSWORD" | node packages/db/scripts/hash-admin-password.mjs)"
          echo "BDA_ADMIN_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"
      - name: Chromium browser availability
        run: pnpm exec playwright install --with-deps chromium
      - name: Real protected browser login / logout / CSRF / cookie test
        run: node scripts/check-admin-auth.mjs
      - name: Browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bda-025-admin-auth-qa
          path: .tmp-admin-auth-qa/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Export generated migration and pnpm lockfile (temporary bootstrap)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$(find packages/db/drizzle -maxdepth 1 -type f -name '0002_*.sql' -print -quit)"
          test -n "$file"
          echo BDA025_SQL_PATH="$file"
          for kind in SQL SNAPSHOT JOURNAL LOCKFILE; do
            case "$kind" in
              SQL) file_to_print="$file" ;;
              SNAPSHOT) file_to_print="packages/db/drizzle/meta/0002_snapshot.json" ;;
              JOURNAL) file_to_print="packages/db/drizzle/meta/_journal.json" ;;
              LOCKFILE) file_to_print="pnpm-lock.yaml" ;;
            esac
            echo "BDA025_${kind}_START"
            base64 -w0 "$file_to_print"
            echo
            echo "BDA025_${kind}_END"
          done
      - name: Formatter diagnostics during bootstrap
        if: always()
        run: |
          pnpm exec prettier --write "apps/**/*.{ts,tsx,json}" "packages/**/*.{ts,tsx,json}" package.json tsconfig.base.json pnpm-workspace.yaml eslint.config.mjs .prettierrc.json
          git diff -- apps/web packages/db package.json
