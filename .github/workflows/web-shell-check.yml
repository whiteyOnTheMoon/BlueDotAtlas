name: M02 022 Next.js web shell browser QA

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-app-shell.mjs'
      - '.github/workflows/web-shell-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Screenshot and routing smoke
        run: node scripts/check-app-shell.mjs
      - name: Save real browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-022-screenshots
          path: .tmp-web-shell-qa/
          retention-days: 14
          if-no-files-found: warn
