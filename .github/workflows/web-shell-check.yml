name: M02 022 Next.js web shell browser QA

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-app-shell.mjs'
      - '.github/workflows/web-shell-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Verify runner Chrome for browser regression
        run: google-chrome --version
      - name: Screenshot and routing smoke
        run: node scripts/check-app-shell.mjs
      - name: Verify production preview is not available
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @bluedotatlas/web start --hostname 127.0.0.1 --port 3110 > /tmp/bda-022-prod.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3110/ || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/bda-022-prod.log
            echo "Production app did not start"
            exit 1
          fi
          preview="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3110/preview/admin)"
          admin="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3110/admin)"
          login="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3110/admin/login)"
          echo "Production status /preview/admin=$preview, /admin=$admin, /admin/login=$login"
          [ "$preview" = "404" ]
          [ "$admin" = "307" ] || [ "$admin" = "308" ]
          [ "$login" = "200" ]
      - name: Save real browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-022-screenshots
          path: .tmp-web-shell-qa/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
