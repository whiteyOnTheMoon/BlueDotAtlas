name: Temporary 040 format bootstrap (self-removing)

on:
  push:
    branches:
      - feat/040-motion-graphics

permissions:
  contents: write

jobs:
  format-once:
    name: Prettier 040 source files once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible frozen installation
        run: pnpm install --frozen-lockfile
      - name: Format only the 040 TypeScript and package files
        run: |
          pnpm exec prettier --write packages/video/src/compositions/GraphicsScene.tsx packages/video/src/compositions/GraphicsProof.tsx packages/video/src/compositions/RemotionRoot.tsx packages/video/src/compositions/graphics-plan.js packages/video/package.json
      - name: Commit formatting and remove temporary workflow
        run: |
          set -eu
          test "$(git branch --show-current)" = "feat/040-motion-graphics"
          git rm -- .github/workflows/graphics-040-format-bootstrap.yml
          git add -- packages/video/
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(040): format graphics module and self-remove bootstrap workflow"
          git push origin HEAD:feat/040-motion-graphics
