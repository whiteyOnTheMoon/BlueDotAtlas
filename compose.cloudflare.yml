# Roadmap 029: optional Cloudflare Tunnel wiring for later separately approved deployment.
# No tunnel/hostname/credentials are created by this file or by its CI validation.
# Choose this overlay INSTEAD OF compose.loopback.yml: base has NO host ports.
services:
  cloudflared:
    profiles: [future-tunnel]
    image: ${BDA_CLOUDFLARED_IMAGE:?Specify reviewed pinned cloudflare/cloudflared image}
    # Local Compose file-secrets are bind-mounted and retain host file ownership.
    # Run with the UID:GID of the owner of the private 0600 token file, never root.
    user: "${BDA_TUNNEL_UID:?Set nonroot UID of token file owner}:${BDA_TUNNEL_GID:?Set nonroot GID of token file owner}"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/bda_tunnel_token
    secrets:
      - bda_tunnel_token
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.1
    mem_limit: 128m
    pids_limit: 100
    networks:
      - edge
secrets:
  bda_tunnel_token:
    file: ${BDA_TUNNEL_TOKEN_FILE:?External private tunnel token file required}
